---
layout: default
title: 編解碼工具
---

<div class="mb-4">
    <h4><i class="bi bi-braces"></i> 編碼解碼工具</h4>
    <p class="text-muted">支援 Base64、HTML Entity、URL 編碼與解碼轉換。在左側輸入原始文字，點擊箭頭按鈕即可進行編碼或解碼。</p>
</div>

<ul class="nav nav-tabs mb-4" id="toolTabs" role="tablist">
    <li class="nav-item" role="presentation">
        <button class="nav-link active" id="base64-tab" type="button" role="tab"
            onclick="changeMode('base64', this)">Base64</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="html-tab" type="button" role="tab" onclick="changeMode('html', this)">Html</button>
    </li>
    <li class="nav-item" role="presentation">
        <button class="nav-link" id="url-tab" type="button" role="tab" onclick="changeMode('url', this)">Url</button>
    </li>
</ul>

<div class="row align-items-center mb-5">
    <!-- 左側：原始文字 -->
    <div class="col-md-5">
        <label class="form-label fw-bold">原始文字</label>
        <textarea id="inputText" class="form-control" rows="15" style="resize: vertical;"></textarea>
        <div class="d-flex justify-content-between align-items-center mt-2">
            <div class="text-muted small" id="inputCount">0 字</div>
            <div class="text-end">
                <button class="btn btn-outline-secondary btn-sm" onclick="copyText(this, 'inputText')" title="複製">
                    <i class="bi bi-copy"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 中間：功能按鈕 -->
    <div class="col-md-2 text-center d-flex flex-column justify-content-center align-items-center gap-3">
        <button class="btn btn-outline-secondary d-flex justify-content-center align-items-center"
            style="width:44px; height:36px;" onclick="processText('encode')" title="編碼 (Encode)">
            <i class="bi bi-arrow-right"></i>
        </button>
        <button class="btn btn-outline-secondary d-flex justify-content-center align-items-center"
            style="width:44px; height:36px;" onclick="processText('decode')" title="解碼 (Decode)">
            <i class="bi bi-arrow-left"></i>
        </button>
    </div>

    <!--右側：結果文字 -->
    <div class="col-md-5">
        <label class="form-label fw-bold" id="resultLabel">結果文字 (base64)</label>
        <textarea id="outputText" class="form-control" rows="15" style="resize: vertical;"></textarea>
        <div class="d-flex justify-content-between align-items-center mt-2">
            <div class="text-muted small" id="outputCount">0 字</div>
            <div class="text-end">
                <button class="btn btn-outline-secondary btn-sm" onclick="copyText(this, 'outputText')" title="複製">
                    <i class="bi bi-copy"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentMode = 'base64';

    function changeMode(mode, btnElement) {
        currentMode = mode.toLowerCase();
        document.getElementById('resultLabel').innerText = `結果文字 (${mode})`;

        // 更新 Tab 的 Highlight (active) 樣式
        document.querySelectorAll('#toolTabs .nav-link').forEach(btn => {
            btn.classList.remove('active');
        });
        if (btnElement) {
            btnElement.classList.add('active');
        }

        updateCounts();
    }

    function processText(action) {
        //依據行為決定輸入輸出的框
        const inputId = action === 'encode' ? 'inputText' : 'outputText';
        const outputId = action === 'encode' ? 'outputText' : 'inputText';

        const input = document.getElementById(inputId).value;
        const outputEl = document.getElementById(outputId);

        if (!input) {
            return; // 空值不處理也不跳錯，比較符合流暢體驗
        }

        try {
            let result = '';
            switch (currentMode) {
                case 'url':
                    result = action === 'encode' ? encodeURIComponent(input) : decodeURIComponent(input);
                    break;
                case 'html':
                    result = action === 'encode' ? encodeHTML(input) : decodeHTML(input);
                    break;
                case 'base64':
                    if (action === 'encode') {
                        // 支援中文的 Base64 編碼
                        result = btoa(encodeURIComponent(input).replace(/%([0-9A-F]{2})/g,
                            function toSolidBytes(match, p1) {
                                return String.fromCharCode('0x' + p1);
                            }));
                    } else {
                        // 支援中文的 Base64 解碼
                        result = decodeURIComponent(atob(input).split('').map(function (c) {
                            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                        }).join(''));
                    }
                    break;
            }

            outputEl.value = result;
            updateCounts();

        } catch (e) {
            alert(`轉換時發生錯誤！\n請確認您的輸入內容是否符合該格式之解碼規則。`);
        }
    }

    function encodeHTML(str) {
        return str.replace(/[\u00A0-\u9999<>\&]/g, function (i) {
            return '&#' + i.charCodeAt(0) + ';';
        });
    }

    function decodeHTML(str) {
        var txt = document.createElement("textarea");
        txt.innerHTML = str;
        return txt.value;
    }

    function updateCounts() {
        const input = document.getElementById('inputText');
        const output = document.getElementById('outputText');
        const inCountEl = document.getElementById('inputCount');
        const outCountEl = document.getElementById('outputCount');

        inCountEl.innerText = `${input.value.length} 字`;
        outCountEl.innerText = `${output.value.length} 字`;
    }

    //監聽輸入事件以即時更新字數
    document.addEventListener('DOMContentLoaded', function () {
        const input = document.getElementById('inputText');
        const output = document.getElementById('outputText');
        input.addEventListener('input', updateCounts);
        output.addEventListener('input', updateCounts);
        updateCounts();
    });
</script>
