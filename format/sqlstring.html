---
layout: default
title: SQL 格式化工具
---

<div class="mb-4">
    <h4><i class="bi bi-database"></i> SQL 格式化工具</h4>
    <p class="text-muted">輸入 SQL 語句，點擊格式化按鈕轉換為標準的縮排與排版。支援語法高亮與行號顯示。</p>
</div>

<div class="row">
    <!-- 左側：輸入區 -->
    <div class="col-md-6 mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label fw-bold mb-0">Enter SQL here:</label>
            <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" onclick="formatSQL()" title="格式化">
                    <i class="bi bi-magic"></i>
                </button>
                <button class="btn btn-outline-secondary" onclick="copyText(this, 'inputText')" title="複製">
                    <i class="bi bi-copy"></i>
                </button>
                <button class="btn btn-outline-secondary" onclick="clearInput()" title="清除">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>
        <div class="code-editor-wrapper">
            <textarea id="inputText" class="code-editor" spellcheck="false"
                      placeholder="SELECT id, name FROM users WHERE active = 1">
SELECT id, name FROM users WHERE active = 1
</textarea>
        </div>
    </div>

    <!-- 右側：輸出區 -->
    <div class="col-md-6 mb-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label fw-bold mb-0">Results:</label>
            <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" onclick="toggleEditMode()" title="切換編輯/預覽模式" id="editModeBtn">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-outline-secondary" onclick="minifySQL()" title="壓縮">
                    <i class="bi bi-arrows-collapse"></i>
                </button>
                <button class="btn btn-outline-secondary" onclick="toggleFullscreen('outputContainer')" title="全螢幕">
                    <i class="bi bi-arrows-fullscreen"></i>
                </button>
                <button class="btn btn-outline-secondary" onclick="copyOutputText()" title="複製">
                    <i class="bi bi-copy"></i>
                </button>
                <button class="btn btn-outline-secondary" onclick="clearOutput()" title="清除">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>
        <div class="code-editor-wrapper" id="outputContainer">
            <!-- 全螢幕關閉按鈕 -->
            <button class="fullscreen-close-btn" onclick="closeFullscreen('outputContainer')" title="關閉全螢幕 (ESC)">
                <i class="bi bi-x-lg"></i>
            </button>
            <!-- 語法高亮預覽模式 -->
            <div class="code-output" id="codeOutput">
                <div class="line-numbers" id="lineNumbers"></div>
                <div class="code-content" id="codeContent"></div>
            </div>
            <!-- 編輯模式 (隱藏的 textarea) -->
            <textarea id="outputText" class="code-editor" spellcheck="false" style="display: none;"></textarea>
        </div>
    </div>
</div>

<!-- 選項區 -->
<div class="card mb-3">
    <div class="card-body py-2">
        <div class="row align-items-center">
            <div class="col-auto mb-2 mb-md-0">
                <span class="text-muted small">資料庫語系：</span>
                <select id="dialectSelect" class="form-select form-select-sm d-inline-block w-auto ms-1">
                    <option value="sql">標準 SQL</option>
                    <option value="postgresql">PostgreSQL</option>
                    <option value="mysql">MySQL</option>
                    <option value="mariadb">MariaDB</option>
                    <option value="sqlite">SQLite</option>
                    <option value="tsql">T-SQL (SQL Server)</option>
                    <option value="plsql">PL/SQL (Oracle)</option>
                </select>
            </div>
            <div class="col-auto">
                <span class="text-muted small ms-md-3">縮排：</span>
                <div class="btn-group btn-group-sm ms-2" id="indentGroup">
                    <button class="btn btn-outline-secondary" onclick="setIndent(2, this)">2 空格</button>
                    <button class="btn btn-outline-secondary active" onclick="setIndent(4, this)">4 空格</button>
                    <button class="btn btn-outline-secondary" onclick="setIndent('tab', this)">Tab</button>
                </div>
            </div>
            <div class="col-auto">
                <span class="text-muted small ms-md-3">大小寫：</span>
                <div class="btn-group btn-group-sm ms-2" id="caseGroup">
                    <button class="btn btn-outline-secondary active" onclick="setCase('upper', this)">大寫</button>
                    <button class="btn btn-outline-secondary" onclick="setCase('lower', this)">小寫</button>
                    <button class="btn btn-outline-secondary" onclick="setCase('preserve', this)">保留</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 狀態提示 -->
<div class="alert alert-success py-2" id="successAlert" style="display: none;">
    <i class="bi bi-check-circle"></i> <span id="successMessage"></span>
</div>
<div class="alert alert-danger py-2" id="errorAlert" style="display: none;">
    <i class="bi bi-exclamation-triangle"></i> <span id="errorMessage"></span>
</div>

<style>
    .code-editor-wrapper {
        border: 1px solid var(--gh-border-color, #d0d7de);
        border-radius: 6px;
        overflow: hidden;
        background: #fff;
        position: relative;
    }

    .code-editor {
        width: 100%;
        height: 450px;
        border: none;
        padding: 12px;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
        line-height: 20px;
        resize: none;
        outline: none;
        background: #fff;
        overflow: auto;
        white-space: pre;
    }

    .code-output {
        display: flex;
        height: 450px;
        overflow: auto;
        background: #fff;
    }

    .line-numbers {
        flex-shrink: 0;
        padding: 12px 8px;
        background: #f6f8fa;
        border-right: 1px solid #e1e4e8;
        text-align: right;
        user-select: none;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
        color: #8c959f;
        min-width: 40px;
        position: sticky;
        left: 0;
        z-index: 1;
    }

    .line-numbers .line-number {
        display: block;
        height: 20px;
        line-height: 20px;
        padding-right: 4px;
    }

    .line-numbers .line-number.highlight {
        background: rgba(9, 105, 218, 0.1);
    }

    .code-content {
        flex: 1;
        margin: 0;
        padding: 12px;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 13px;
        white-space: pre;
        overflow: visible;
        background: transparent;
        min-width: max-content;
    }

    .code-content .code-line {
        display: block;
        height: 20px;
        line-height: 20px;
        white-space: pre;
    }

    .code-content .code-line:hover {
        background: rgba(9, 105, 218, 0.06);
    }

    .code-content .code-line.highlight {
        background: rgba(9, 105, 218, 0.1);
    }

    /* SQL 語法高亮顏色 */
    .sql-keyword { color: #d73a49; font-weight: bold; }
    .sql-function { color: #6f42c1; }
    .sql-string { color: #032f62; }
    .sql-number { color: #005cc5; }
    .sql-comment { color: #6a737d; font-style: italic; }
    .sql-operator { color: #d73a49; }

    /* 全螢幕關閉按鈕 */
    .fullscreen-close-btn {
     display: none;
        position: absolute;
        top: 10px;
     right: 25px;
    z-index: 10000;
     width: 40px;
        height: 40px;
 border: none;
        border-radius: 6px;
        background: #f6f8fa;
        color: #24292e;
        font-size: 18px;
        cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        transition: all 0.2s;
    }

    .fullscreen-close-btn:hover {
 background: #e1e4e8;
        color: #cf222e;
  }

    /* 全螢幕模式 */
 .code-editor-wrapper.fullscreen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
 bottom: 0;
        z-index: 9999;
   border-radius: 0;
    }

  .code-editor-wrapper.fullscreen .fullscreen-close-btn {
display: flex;
  align-items: center;
        justify-content: center;
    }

    .code-editor-wrapper.fullscreen .code-output,
    .code-editor-wrapper.fullscreen .code-editor {
        height: 100vh;
    }

    /* 編輯模式按鈕激活狀態 */
    #editModeBtn.active {
        background-color: #0969da;
        border-color: #0969da;
        color: #fff;
    }
</style>

<!-- 匯入 sql-formatter -->
<script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.3.1/dist/sql-formatter.min.js"></script>

<script>
    let indentString = '    ';
    let keywordCase = 'upper';
    let isEditMode = false;

    const sqlKeywords = /\b(SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|JOIN|ON|INNER|LEFT|RIGHT|OUTER|FULL|GROUP BY|ORDER BY|HAVING|LIMIT|OFFSET|UNION|ALL|INSERT INTO|VALUES|UPDATE|SET|DELETE|CREATE|ALTER|DROP|TABLE|INDEX|VIEW|TRIGGER|CASE|WHEN|THEN|ELSE|END|EXISTS|BETWEEN|LIKE)\b/gi;
    const sqlFunctions = /\b(COUNT|SUM|AVG|MIN|MAX|COALESCE|CAST|CONVERT|DATE|TIME|NOW)\b/gi;

    function formatSQL() {
  const input = document.getElementById('inputText').value;
        const dialect = document.getElementById('dialectSelect').value;

        hideAlerts();

        if (!input.trim()) {
       showError('請輸入 SQL 語法');
          return;
        }

        if (typeof sqlFormatter === 'undefined') {
    showError('載入格式化工具失敗，請檢查網路連線。');
      return;
        }

   try {
          const formatted = sqlFormatter.format(input, {
     language: dialect,
 indent: indentString,
            keywordCase: keywordCase
   });

      document.getElementById('outputText').value = formatted;
           displayWithSyntaxHighlight(formatted);

   if (isEditMode) {
      toggleEditMode();
     }

            const lines = formatted.split('\n').length;
          showSuccess(`SQL 格式化成功！共 ${lines} 行`);
        } catch (e) {
       showError('SQL 格式化錯誤：' + e.message);
        }
}

    function minifySQL() {
        const output = document.getElementById('outputText').value;

 hideAlerts();

if (!output.trim()) {
 showError('Results 區域沒有內容');
            return;
     }

      try {
   let minified = output
   .replace(/(--.*$)/gm, '')
      .replace(/\r?\n|\r/g, ' ')
       .replace(/\s+/g, ' ')
         .trim();

            document.getElementById('inputText').value = minified;

            const savedChars = output.length - minified.length;
   showSuccess(`壓縮成功！減少 ${savedChars} 字元，已更新到輸入區`);
        } catch (e) {
   showError('SQL 壓縮錯誤：' + e.message);
     }
    }

function toggleEditMode() {
        const codeOutput = document.getElementById('codeOutput');
const outputText = document.getElementById('outputText');
        const editModeBtn = document.getElementById('editModeBtn');

        isEditMode = !isEditMode;

        if (isEditMode) {
    codeOutput.style.display = 'none';
            outputText.style.display = 'block';
    editModeBtn.classList.add('active');
        editModeBtn.title = '切換到預覽模式';
    } else {
const content = outputText.value;
            if (content.trim()) {
     displayWithSyntaxHighlight(content);
  }
            codeOutput.style.display = 'flex';
 outputText.style.display = 'none';
   editModeBtn.classList.remove('active');
         editModeBtn.title = '切換到編輯模式';
    }
    }

    function displayWithSyntaxHighlight(code) {
     const lines = code.split('\n');
    const lineNumbersEl = document.getElementById('lineNumbers');
 const codeContentEl = document.getElementById('codeContent');

    // 生成行號
  lineNumbersEl.innerHTML = lines.map((_, idx) => 
    `<span class="line-number" data-line="${idx + 1}">${idx + 1}</span>`
).join('');

        // 語法高亮，每行用 div.code-line 包裝
codeContentEl.innerHTML = lines.map((line, idx) => {
       const highlighted = highlightSQLLine(line) || '&nbsp;';
            return `<div class="code-line" data-line="${idx + 1}">${highlighted}</div>`;
     }).join('');

        // 綁定 hover 事件
        bindLineHoverEvents();
    }

    function bindLineHoverEvents() {
        const lineNumbersEl = document.getElementById('lineNumbers');
        const codeContentEl = document.getElementById('codeContent');
    const codeLines = codeContentEl.querySelectorAll('.code-line');
 const lineNumbers = lineNumbersEl.querySelectorAll('.line-number');

        // 程式碼行 hover
      codeLines.forEach(lineEl => {
        lineEl.addEventListener('mouseenter', function() {
  const ln = this.getAttribute('data-line');
         this.classList.add('highlight');
  const numEl = lineNumbersEl.querySelector(`.line-number[data-line="${ln}"]`);
    if (numEl) numEl.classList.add('highlight');
    });
       lineEl.addEventListener('mouseleave', function() {
         const ln = this.getAttribute('data-line');
    this.classList.remove('highlight');
     const numEl = lineNumbersEl.querySelector(`.line-number[data-line="${ln}"]`);
    if (numEl) numEl.classList.remove('highlight');
            });
  });

        // 行號 hover
      lineNumbers.forEach(numEl => {
  numEl.addEventListener('mouseenter', function() {
                const ln = this.getAttribute('data-line');
      this.classList.add('highlight');
    const codeEl = codeContentEl.querySelector(`.code-line[data-line="${ln}"]`);
           if (codeEl) codeEl.classList.add('highlight');
  });
    numEl.addEventListener('mouseleave', function() {
                const ln = this.getAttribute('data-line');
       this.classList.remove('highlight');
        const codeEl = codeContentEl.querySelector(`.code-line[data-line="${ln}"]`);
     if (codeEl) codeEl.classList.remove('highlight');
      });
      });
    }

    function highlightSQLLine(line) {
      let escaped = line
            .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
         .replace(/>/g, '&gt;');

        escaped = escaped.replace(/(--.*$)/g, '<span class="sql-comment">$1</span>');
        escaped = escaped.replace(/(['"])(?:(?=(\\?))\2.)*?\1/g, '<span class="sql-string">$&</span>');
        escaped = escaped.replace(sqlKeywords, '<span class="sql-keyword">$&</span>');
        escaped = escaped.replace(sqlFunctions, '<span class="sql-function">$&</span>');
        escaped = escaped.replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="sql-number">$1</span>');

     return escaped;
    }

    function setIndent(size, btnElement) {
        document.querySelectorAll('#indentGroup .btn').forEach(btn => btn.classList.remove('active'));
   btnElement.classList.add('active');

    if (size === 'tab') {
            indentString = '\t';
 } else {
          indentString = ' '.repeat(size);
      }
    }

    function setCase(caseMode, btnElement) {
 document.querySelectorAll('#caseGroup .btn').forEach(btn => btn.classList.remove('active'));
 btnElement.classList.add('active');
  keywordCase = caseMode;
    }

    function clearInput() {
      document.getElementById('inputText').value = '';
   hideAlerts();
    }

    function clearOutput() {
        document.getElementById('outputText').value = '';
     document.getElementById('lineNumbers').innerHTML = '';
        document.getElementById('codeContent').innerHTML = '';
        hideAlerts();
    }

    function copyOutputText() {
      const content = document.getElementById('outputText').value;
        if (!content) {
  showError('沒有可複製的內容');
     return;
     }
        navigator.clipboard.writeText(content).then(() => {
         showSuccess('已複製到剪貼簿！');
  });
 }

    function toggleFullscreen(elementId) {
        const el = document.getElementById(elementId);
        el.classList.add('fullscreen');
 document.body.style.overflow = 'hidden';
    }

    function closeFullscreen(elementId) {
        const el = document.getElementById(elementId);
        el.classList.remove('fullscreen');
        document.body.style.overflow = '';
}

    document.addEventListener('keydown', function (e) {
     if (e.key === 'Escape') {
       const fullscreenEl = document.querySelector('.code-editor-wrapper.fullscreen');
       if (fullscreenEl) {
      fullscreenEl.classList.remove('fullscreen');
     document.body.style.overflow = '';
   }
        }
    });

    function showSuccess(message) {
 document.getElementById('successMessage').textContent = message;
 document.getElementById('successAlert').style.display = 'block';
        setTimeout(() => hideAlerts(), 3000);
    }

    function showError(message) {
        document.getElementById('errorMessage').textContent = message;
        document.getElementById('errorAlert').style.display = 'block';
    }

    function hideAlerts() {
        document.getElementById('successAlert').style.display = 'none';
        document.getElementById('errorAlert').style.display = 'none';
    }
</script>
