---
layout: default
title: 圖片轉 Base64
---

<div class="row">
    <div class="col-12">
        <h1 class="mb-4"><i class="bi bi-image"></i> 圖片轉 Base64</h1>
        <p class="text-muted">選擇圖片檔案或直接貼上剪貼簿中的圖片，即可轉換為 Base64 字串。</p>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-6 mb-3">
        <label for="imageInput" class="form-label fw-bold">
            <i class="bi bi-folder2-open"></i> 選擇圖片檔案
        </label>
        <input class="form-control" type="file" id="imageInput" accept="image/*">
    </div>
</div>

<div class="row mb-4">
    <div class="col-12">
        <div id="dropZone" class="border border-2 border-dashed rounded p-5 text-center bg-light"
             style="border-style: dashed !important; cursor: pointer; min-height: 150px;">
            <i class="bi bi-clipboard-plus fs-1 text-secondary"></i>
            <p class="mt-2 mb-0 text-secondary">
                拖放圖片到此處，或按 <kbd>Ctrl</kbd> + <kbd>V</kbd> 貼上剪貼簿中的圖片
            </p>
        </div>
    </div>
</div>

<div class="row mb-4" id="previewSection" style="display: none;">
    <div class="col-12">
        <h5 class="fw-bold"><i class="bi bi-eye"></i> 圖片預覽</h5>
        <div class="card">
            <div class="card-body text-center">
                <img id="imagePreview" class="img-fluid rounded" style="max-height: 400px;" alt="圖片預覽">
            </div>
            <div class="card-footer text-muted">
                <small id="imageInfo"></small>
            </div>
        </div>
    </div>
</div>

<div class="row mb-4" id="base64Section" style="display: none;">
    <div class="col-12">
        <h5 class="fw-bold"><i class="bi bi-code-square"></i> Base64 字串</h5>

        <ul class="nav nav-tabs" id="base64Tabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="dataurl-tab" data-bs-toggle="tab" data-bs-target="#dataurl"
                        type="button" role="tab" aria-controls="dataurl" aria-selected="true">
                    Data URL (含前綴)
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="rawbase64-tab" data-bs-toggle="tab" data-bs-target="#rawbase64"
                        type="button" role="tab" aria-controls="rawbase64" aria-selected="false">
                    純 Base64
                </button>
            </li>
        </ul>

        <div class="tab-content border border-top-0 rounded-bottom p-3" id="base64TabContent">
            <div class="tab-pane fade show active" id="dataurl" role="tabpanel" aria-labelledby="dataurl-tab">
                <div class="mb-2">
                    <button class="btn btn-sm btn-outline-primary" id="copyDataUrlBtn">
                        <i class="bi bi-clipboard"></i> 複製
                    </button>
                    <span id="copyFeedbackDataUrl" class="text-success ms-2" style="display: none;">
                        <i class="bi bi-check-lg"></i> 已複製！
                    </span>
                </div>
                <textarea id="base64DataUrl" class="form-control font-monospace" rows="6" readonly
                          style="font-size: 0.85rem;"></textarea>
            </div>
            <div class="tab-pane fade" id="rawbase64" role="tabpanel" aria-labelledby="rawbase64-tab">
                <div class="mb-2">
                    <button class="btn btn-sm btn-outline-primary" id="copyRawBtn">
                        <i class="bi bi-clipboard"></i> 複製
                    </button>
                    <span id="copyFeedbackRaw" class="text-success ms-2" style="display: none;">
                        <i class="bi bi-check-lg"></i> 已複製！
                    </span>
                </div>
                <textarea id="base64Raw" class="form-control font-monospace" rows="6" readonly
                          style="font-size: 0.85rem;"></textarea>
            </div>
        </div>

        <div class="mt-3">
            <small class="text-muted">
                <i class="bi bi-info-circle"></i>
                Base64 字串長度：<span id="base64Length">0</span> 字元
            </small>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <button class="btn btn-secondary" id="clearBtn" style="display: none;">
            <i class="bi bi-x-circle"></i> 清除
        </button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const imagePreview = document.getElementById('imagePreview');
        const previewSection = document.getElementById('previewSection');
        const base64Section = document.getElementById('base64Section');
        const base64DataUrl = document.getElementById('base64DataUrl');
        const base64Raw = document.getElementById('base64Raw');
        const base64Length = document.getElementById('base64Length');
        const imageInfo = document.getElementById('imageInfo');
        const clearBtn = document.getElementById('clearBtn');

        // 手動初始化 Tab
        const tabButtons = document.querySelectorAll('#base64Tabs button[data-bs-toggle="tab"]');
        tabButtons.forEach(function (tabButton) {
            tabButton.addEventListener('click', function (e) {
                e.preventDefault();
                const tab = new bootstrap.Tab(tabButton);
                tab.show();
            });
        });

        // 檔案選擇事件
        imageInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                processFile(file);
            }
        });

        // 拖放事件
        dropZone.addEventListener('dragover', function (e) {
            e.preventDefault();
            dropZone.classList.add('bg-primary', 'bg-opacity-10');
            dropZone.classList.remove('bg-light');
        });

        dropZone.addEventListener('dragleave', function (e) {
            e.preventDefault();
            dropZone.classList.remove('bg-primary', 'bg-opacity-10');
            dropZone.classList.add('bg-light');
        });

        dropZone.addEventListener('drop', function (e) {
            e.preventDefault();
            dropZone.classList.remove('bg-primary', 'bg-opacity-10');
            dropZone.classList.add('bg-light');

            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.startsWith('image/')) {
                processFile(files[0]);
            }
        });

        // 點擊拖放區域也可以選擇檔案
        dropZone.addEventListener('click', function () {
            imageInput.click();
        });

        // 剪貼簿貼上事件
        document.addEventListener('paste', function (e) {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.startsWith('image/')) {
                    const file = items[i].getAsFile();
                    processFile(file);
                    break;
                }
            }
        });

        // 處理圖片檔案
        function processFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('請選擇圖片檔案！');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const dataUrl = e.target.result;

                // 顯示預覽
                imagePreview.src = dataUrl;
                previewSection.style.display = 'block';

                // 顯示圖片資訊
                const fileSizeKB = (file.size / 1024).toFixed(2);
                const fileSizeMB = (file.size / 1024 / 1024).toFixed(2);
                const sizeText = file.size > 1024 * 1024 ? `${fileSizeMB} MB` : `${fileSizeKB} KB`;
                imageInfo.textContent = `檔案名稱：${file.name || '剪貼簿圖片'} | 檔案大小：${sizeText} | 類型：${file.type}`;

                // 顯示 Base64
                base64DataUrl.value = dataUrl;

                // 純 Base64（移除 data:image/xxx;base64, 前綴）
                const rawBase64 = dataUrl.split(',')[1];
                base64Raw.value = rawBase64;

                base64Length.textContent = dataUrl.length.toLocaleString();
                base64Section.style.display = 'block';

                // 顯示清除按鈕
                clearBtn.style.display = 'inline-block';
            };
            reader.readAsDataURL(file);
        }

        // 複製到剪貼簿
        function copyToClipboard(elementId, feedbackId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            textarea.setSelectionRange(0, 99999999);

            navigator.clipboard.writeText(textarea.value).then(function () {
                const feedback = document.getElementById(feedbackId);
                feedback.style.display = 'inline';
                setTimeout(function () {
                    feedback.style.display = 'none';
                }, 2000);
            });
        }

        // 綁定複製按鈕事件
        document.getElementById('copyDataUrlBtn').addEventListener('click', function () {
            copyToClipboard('base64DataUrl', 'copyFeedbackDataUrl');
        });

        document.getElementById('copyRawBtn').addEventListener('click', function () {
            copyToClipboard('base64Raw', 'copyFeedbackRaw');
        });

        // 清除所有
        clearBtn.addEventListener('click', function () {
            imageInput.value = '';
            imagePreview.src = '';
            previewSection.style.display = 'none';
            base64DataUrl.value = '';
            base64Raw.value = '';
            base64Length.textContent = '0';
            base64Section.style.display = 'none';
            clearBtn.style.display = 'none';
            imageInfo.textContent = '';
        });
    });
</script>
