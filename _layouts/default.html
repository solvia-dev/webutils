<!DOCTYPE html>
<html lang="zh-Hant" class="h-100">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ '/img/icon_96x96.ico' | relative_url }}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom GitHub-inspired Style -->
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1636725382110643"
        crossorigin="anonymous"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-GVMH799V7S"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-GVMH799V7S');
    </script>
</head>

<body>
    <!-- Top navbar 搬到最外層 -->
    <nav id="topbar" class="navbar navbar-light sticky-top shadow-sm">
        <div class="container-fluid">
            <!-- 漢堡選單按鈕 -->
            <button class="btn btn-outline-secondary border-0" id="sidebarToggle" type="button"
                style="background-color: #f8f9fa;">
                <i class="bi bi-list fs-4"></i>
            </button>

            <!-- 美化版 Logo 區塊 -->
            <a href="{{ '/' | relative_url }}" class="text-decoration-none brand-logo-wrapper ms-2">
                <div class="navbar-brand mb-0 d-flex align-items-center user-select-none">
                    <div class="logo-glass-icon me-2 d-flex justify-content-center align-items-center shadow-sm">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L22 7.5V16.5L12 22L2 16.5V7.5L12 2Z" fill="url(#solvia-grad)"
                                fill-opacity="0.10" stroke="url(#solvia-grad)" stroke-width="1.8"
                                stroke-linejoin="round" />
                            <path
                                d="M14.5 9C14.5 7.61929 13.3807 6.5 12 6.5C10.6193 6.5 9.5 7.61929 9.5 9C9.5 10.3807 10.6193 11.5 12 11.5C13.3807 11.5 14.5 12.6193 14.5 14C14.5 15.3807 13.3807 16.5 12 16.5C10.6193 16.5 9.5 15.3807 9.5 14"
                                stroke="url(#solvia-grad)" stroke-width="2.2" stroke-linecap="round" />
                            <circle cx="18" cy="18" r="6" fill="white" />
                            <g transform="translate(12.5, 12.5) scale(0.6875)" fill="url(#solvia-grad)">
                                <path
                                    d="M8 4.754a3.246 3.246 0 1 0 0 6.492 3.246 3.246 0 0 0 0-6.492zM5.754 8a2.246 2.246 0 1 1 4.492 0 2.246 2.246 0 0 1-4.492 0z" />
                                <path
                                    d="M9.796 1.343c-.527-1.79-3.065-1.79-3.592 0l-.094.319a.873.873 0 0 1-1.255.52l-.292-.16c-1.64-.892-3.433.902-2.54 2.541l.159.292a.873.873 0 0 1-.52 1.255l-.319.094c-1.79.527-1.79 3.065 0 3.592l.319.094a.873.873 0 0 1 .52 1.255l-.16.292c-.892 1.64.901 3.434 2.541 2.54l.292-.159a.873.873 0 0 1 1.255.52l.094.319c.527 1.79 3.065 1.79 3.592 0l.094-.319a.873.873 0 0 1 1.255-.52l.292.16c1.64.893 3.434-.902 2.54-2.541l-.159-.292a.873.873 0 0 1 .52-1.255l.319-.094c1.79-.527 1.79-3.065 0-3.592l-.319-.094a.873.873 0 0 1-.52-1.255l.16-.292c.893-1.64-.902-3.433-2.541-2.54l-.292.159a.873.873 0 0 1-1.255-.52l-.094-.319zm-2.633.283c.246-.835 1.428-.835 1.674 0l.094.319a1.873 1.873 0 0 0 2.693 1.115l.291-.16c.764-.415 1.6.42 1.184 1.185l-.159.292a1.873 1.873 0 0 0 1.116 2.692l.318.094c.835.246.835 1.428 0 1.674l-.319.094a1.873 1.873 0 0 0-1.115 2.693l.16.291c.415.764-.42 1.6-1.185 1.184l-.291-.159a1.873 1.873 0 0 0-2.693 1.116l-.094.318c-.246.835-1.428.835-1.674 0l-.094-.319a1.873 1.873 0 0 0-2.692-1.115l-.292.16c-.764.415-1.6-.42-1.184-1.185l.159-.291A1.873 1.873 0 0 0 1.945 8.93l-.319-.094c-.835-.246-.835-1.428 0-1.674l.319-.094A1.873 1.873 0 0 0 3.06 4.377l-.16-.292c-.415-.764.42-1.6 1.185-1.184l.292.159a1.873 1.873 0 0 0 2.692-1.115l.094-.319z" />
                            </g>
                            <defs>
                                <linearGradient id="solvia-grad" x1="2" y1="2" x2="22" y2="22"
                                    gradientUnits="userSpaceOnUse">
                                    <stop stop-color="#0ea5e9" />
                                    <stop offset="1" stop-color="#6366f1" />
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <div class="brand-text-wrapper">
                        <span class="brand-solvia">Solvia</span>
                        <span class="brand-dev">Dev</span>
                        <span class="badge rounded-pill brand-badge ms-1 shadow-sm">Webutils</span>
                    </div>
                </div>
            </a>
            <div class="ms-auto flex-grow-1"></div>
        </div>
    </nav>

    <!-- 下方主要區域 (含 Sidebar 與 Content) -->
    <div id="main-wrapper" style="height: calc(100vh - 61px);">
        <!-- Sidebar overlay (mobile) -->
        <div id="sidebar-overlay"></div>

        <!-- Left sidebar (變成在 Navbar 下方) -->
        <div class="border-end bg-light" style="overflow-y: auto;">
            {% include sidebar.html %}
        </div>

        <!-- Main content area -->
        <div id="content-wrapper" style="overflow-y: auto;">

            <!-- Content and ad area -->
            <div class="d-flex flex-grow-1">
                <!-- Main content -->
                <main class="flex-grow-1 p-4">
                    <div class="container-fluid">
                        {{ content }}
                    </div>
                </main>

                <!-- Right ad sidebar -->
                <aside id="ad-sidebar" class="d-none d-lg-block">
                    <div class="sticky-top" style="top: 1rem;">
                        <h6 class="text-muted mb-3"><i class="bi bi-megaphone"></i> </h6>
                        <div class="ad-placeholder mb-3">
                            <i class="bi bi-image fs-1 d-block mb-2"></i>
                            <small> 300x250</small>
                        </div>
                        <div class="ad-placeholder">
                            <i class="bi bi-image fs-1 d-block mb-2"></i>
                            <small> 300x600</small>
                        </div>
                    </div>
                </aside>
            </div>

            <!-- Footer -->
            {% include footer.html %}
        </div>
    </div>

    <!-- Bootstrap 5 JS bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Helper JS -->
    <script src="{{ '/js/helper.js' | relative_url }}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebarOverlay = document.getElementById('sidebar-overlay');

            // Toggle sidebar
            sidebarToggle.addEventListener('click', function () {
                if (window.innerWidth < 992) {
                    // Mobile: slide in/out
                    sidebar.classList.toggle('show');
                    sidebarOverlay.classList.toggle('show');
                } else {
                    // Desktop: collapse
                    sidebar.classList.toggle('collapsed');
                }
            });

            // Click overlay to close sidebar (mobile)
            sidebarOverlay.addEventListener('click', function () {
                sidebar.classList.remove('show');
                sidebarOverlay.classList.remove('show');
            });

            // 當 Sidebar 處於收縮狀態時，點擊裡面的任何按鈕都會自動將其展開
            sidebar.addEventListener('click', function (e) {
                if (sidebar.classList.contains('collapsed')) {
                    // 點擊即展開
                    sidebar.classList.remove('collapsed');

                    // 如果點擊的是目錄層 (nav-category)，為避免 bootstrap 剛好把展開的目錄關閉
                    // 可以利用 stopPropagation 來擋住這一次的點擊事件傳遞
                    const categoryLink = e.target.closest('.nav-category');
                    if (categoryLink && categoryLink.getAttribute('aria-expanded') === 'true') {
                        e.stopPropagation();
                        e.preventDefault();
                    }
                }
            }, true); // 加上 true 以在捕獲階段優先處理，避免 Bootstrap 搶先切換選單

            // Reset state on window resize
            window.addEventListener('resize', function () {
                if (window.innerWidth >= 992) {
                    sidebar.classList.remove('show');
                    sidebarOverlay.classList.remove('show');
                }
            });
        });
    </script>
</body>

</html>
