<!DOCTYPE html>
<html lang="zh-Hant" class="h-100">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ '/img/icon_96x96.ico' | relative_url }}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom GitHub-inspired Style -->
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1636725382110643"
        crossorigin="anonymous"></script>
</head>

<body>
    <div id="main-wrapper">
        <!-- Sidebar overlay (mobile) -->
        <div id="sidebar-overlay"></div>

        <!-- Left sidebar -->
        {% include sidebar.html %}

        <!-- Main content area -->
        <div id="content-wrapper">
            <!-- Top navbar -->
            <nav id="topbar" class="navbar navbar-light sticky-top">
                <div class="container-fluid">
                    <button class="btn btn-outline-secondary" id="sidebarToggle" type="button">
                        <i class="bi bi-list"></i>
                    </button>
                    <a href="{{ '/' | relative_url }}" class="text-decoration-none">
                        <span class="navbar-brand mb-0 h1">
                            <img src="{{ '/img/icon.png' | relative_url }}" alt="Logo"
                                style="width: 24px; height: 24px;" class="me-1">
                            {{ site.title }}
                        </span>
                    </a>
                    <div></div>
                </div>
            </nav>

            <!-- Content and ad area -->
            <div class="d-flex flex-grow-1">
                <!-- Main content -->
                <main class="flex-grow-1 p-4">
                    <div class="container-fluid">
                        {{ content }}
                    </div>
                </main>

                <!-- Right ad sidebar -->
                <aside id="ad-sidebar" class="d-none d-lg-block">
                    <div class="sticky-top" style="top: 1rem;">
                        <h6 class="text-muted mb-3"><i class="bi bi-megaphone"></i> </h6>
                        <div class="ad-placeholder mb-3">
                            <i class="bi bi-image fs-1 d-block mb-2"></i>
                            <small> 300x250</small>
                        </div>
                        <div class="ad-placeholder">
                            <i class="bi bi-image fs-1 d-block mb-2"></i>
                            <small> 300x600</small>
                        </div>
                    </div>
                </aside>
            </div>

            <!-- Footer -->
            {% include footer.html %}
        </div>
    </div>

    <!-- Bootstrap 5 JS bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <!-- Helper JS -->
    <script src="{{ '/js/helper.js' | relative_url }}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebarOverlay = document.getElementById('sidebar-overlay');

            // Toggle sidebar
            sidebarToggle.addEventListener('click', function () {
                if (window.innerWidth < 992) {
                    // Mobile: slide in/out
                    sidebar.classList.toggle('show');
                    sidebarOverlay.classList.toggle('show');
                } else {
                    // Desktop: collapse
                    sidebar.classList.toggle('collapsed');
                }
            });

            // Click overlay to close sidebar (mobile)
            sidebarOverlay.addEventListener('click', function () {
                sidebar.classList.remove('show');
                sidebarOverlay.classList.remove('show');
            });

            // Reset state on window resize
            window.addEventListener('resize', function () {
                if (window.innerWidth >= 992) {
                    sidebar.classList.remove('show');
                    sidebarOverlay.classList.remove('show');
                }
            });
        });
    </script>
</body>

</html>
