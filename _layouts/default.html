<!DOCTYPE html>
<html lang="zh-Hant" class="h-100">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* Sidebar styles */
        #sidebar {
            width: 250px;
            min-height: 100vh;
            transition: margin-left 0.3s ease-in-out, width 0.3s ease-in-out;
        }

        #sidebar.collapsed {
            margin-left: -250px;
        }

        #sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 0.75rem 1rem;
            border-radius: 0.25rem;
            margin: 0.125rem 0.5rem;
        }

        #sidebar .nav-link:hover {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        #sidebar .nav-link.active {
            color: #fff;
            background-color: var(--bs-primary);
        }

        #sidebar .nav-link i {
            margin-right: 0.5rem;
        }

        /* Main content area */
        #main-wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        #content-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: margin-left 0.3s ease-in-out;
        }

        /* Ad sidebar */
        #ad-sidebar {
            width: 300px;
            min-width: 300px;
            background-color: #f8f9fa;
            border-left: 1px solid #dee2e6;
            padding: 1rem;
        }

        .ad-placeholder {
            background-color: #e9ecef;
            border: 2px dashed #adb5bd;
            border-radius: 0.5rem;
            padding: 2rem 1rem;
            text-align: center;
            color: #6c757d;
        }

        /* Top navbar */
        #topbar {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
        }

        /* Responsive adjustments */
        @media (max-width: 991.98px) {
            #sidebar {
                position: fixed;
                z-index: 1050;
                margin-left: -250px;
            }

            #sidebar.show {
                margin-left: 0;
            }

            #sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.5);
                z-index: 1040;
            }

            #sidebar-overlay.show {
                display: block;
            }

            #ad-sidebar {
                display: none;
            }
        }

        @media (min-width: 992px) {
            #sidebar.collapsed+#content-wrapper {
                margin-left: 0;
            }
        }

        @media (max-width: 1199.98px) {
            #ad-sidebar {
                width: 200px;
                min-width: 200px;
            }
        }
    </style>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1636725382110643"
        crossorigin="anonymous"></script>
</head>

<body>
    <div id="main-wrapper">
        <!-- Sidebar overlay (mobile) -->
        <div id="sidebar-overlay"></div>

        <!-- Left sidebar -->
        {% include sidebar.html %}

        <!-- Main content area -->
        <div id="content-wrapper">
            <!-- Top navbar -->
            <nav id="topbar" class="navbar navbar-light sticky-top">
                <div class="container-fluid">
                    <button class="btn btn-outline-secondary" id="sidebarToggle" type="button">
                        <i class="bi bi-list"></i>
                    </button>
                    <span class="navbar-brand mb-0 h1">
                        <i class="bi bi-bootstrap-fill text-primary"></i> {{ site.title }}
                    </span>
                    <div></div>
                </div>
            </nav>

            <!-- Content and ad area -->
            <div class="d-flex flex-grow-1">
                <!-- Main content -->
                <main class="flex-grow-1 p-4">
                    <div class="container-fluid">
                        {{ content }}
                    </div>
                </main>

                <!-- Right ad sidebar -->
                <aside id="ad-sidebar" class="d-none d-lg-block">
                    <div class="sticky-top" style="top: 1rem;">
                        <h6 class="text-muted mb-3"><i class="bi bi-megaphone"></i> &#x5EE3;&#x544A;</h6>
                        <div class="ad-placeholder mb-3">
                            <i class="bi bi-image fs-1 d-block mb-2"></i>
                            <small>&#x5EE3;&#x544A;&#x7248;&#x4F4D; 300x250</small>
                        </div>
                        <div class="ad-placeholder">
                            <i class="bi bi-image fs-1 d-block mb-2"></i>
                            <small>&#x5EE3;&#x544A;&#x7248;&#x4F4D; 300x600</small>
                        </div>
                    </div>
                </aside>
            </div>

            <!-- Footer -->
            {% include footer.html %}
        </div>
    </div>

    <!-- Bootstrap 5 JS bundle (includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const sidebar = document.getElementById('sidebar');
            const sidebarToggle = document.getElementById('sidebarToggle');
            const sidebarOverlay = document.getElementById('sidebar-overlay');

            // Toggle sidebar
            sidebarToggle.addEventListener('click', function () {
                if (window.innerWidth < 992) {
                    // Mobile: slide in/out
                    sidebar.classList.toggle('show');
                    sidebarOverlay.classList.toggle('show');
                } else {
                    // Desktop: collapse
                    sidebar.classList.toggle('collapsed');
                }
            });

            // Click overlay to close sidebar (mobile)
            sidebarOverlay.addEventListener('click', function () {
                sidebar.classList.remove('show');
                sidebarOverlay.classList.remove('show');
            });

            // Reset state on window resize
            window.addEventListener('resize', function () {
                if (window.innerWidth >= 992) {
                    sidebar.classList.remove('show');
                    sidebarOverlay.classList.remove('show');
                }
            });
        });
    </script>
</body>

</html>
